name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install OpenMP (xgboost runtime)
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrations apply cleanly on a fresh DB
        env:
          AUTH_DATABASE_URL: "sqlite:///./ci_migrations.db"
        run: alembic upgrade head
      - name: Tests (includes alembic==create_all schema-parity guard)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
