version: '3.8'

services:
  # Optional PostGIS database. The backend auto-detects it via DATABASE_URL and
  # seeds a spatial `cities` table on startup; without it the backend falls back
  # to the in-memory shapely engine.
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=landai
      - POSTGRES_PASSWORD=landai
      - POSTGRES_DB=landai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      # Activate PostGIS spatial backend (comment out to use in-memory shapely)
      - DATABASE_URL=postgresql+psycopg://landai:landai@db:5432/landai
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
